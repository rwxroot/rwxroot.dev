{% extends "base.html" %}

{% block title %}404 Not Found{% endblock title %}

{% block content %}
<section class="section">
    <h1><span class="prompt">$</span> cat /dev/null <span class="cursor-blink"></span></h1>
    <div class="intro-content">
        <p>
            Error 404: Not Found.
        </p>
        <p>
            You got lost. It happens. I don't know what you're looking for. You don't either.
        </p>
        <p>
            Maybe try again? Could work. Maybe. No promises.
        </p>
    </div>
</section>
{% endblock content %}
