<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ config.title }}{% endblock title %}</title>
    <meta name="description" content="{{ config.extra.description }}">
    <meta name="theme-color" content="#1D1D20">
    <link rel="stylesheet" href="{{ get_url(path="css/style.css") | safe }}">
    <link rel="stylesheet" href="{{ get_url(path="css/fonts.css") | safe }}">
    <link rel="icon" type="image/x-icon" href="{{ get_url(path="favicon/favicon.ico") | safe }}">
</head>
<body>
    <header>
        <a href="#" class="site-title">rwxroot.dev</a>
    </header>

    <main>
        {% block content %}{% endblock content %}
    </main>

    <footer>
        <div class="footer-inner">
            <p>&copy; {{ now() | date(format="%Y") }} {{ config.extra.author }}</p>
        </div>
    </footer>
</body>
</html>
